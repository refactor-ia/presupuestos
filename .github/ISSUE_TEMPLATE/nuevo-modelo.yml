name: Nuevo modelo
description: Sumar un LLM al benchmark
title: "[modelo] "
labels: ["nuevo-modelo"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de empezar a implementar, abrí este issue para reservar el modelo y evitar trabajo duplicado.

  - type: input
    id: modelo
    attributes:
      label: Modelo
      description: Nombre y versión del modelo (ej: Gemini 2.5 Pro, Qwen 2.5 Coder 32B)
      placeholder: "Gemini 2.5 Pro"
    validations:
      required: true

  - type: input
    id: vendor
    attributes:
      label: Vendor
      description: Quién provee el modelo
      placeholder: "Google"
    validations:
      required: true

  - type: input
    id: carpeta
    attributes:
      label: Nombre de carpeta
      description: Cómo se va a llamar la subcarpeta del modelo en el repo (lowercase, sin espacios)
      placeholder: "gemini"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Cómo vas a correr el modelo
      description: API directa, web UI, IDE, CLI, agente, etc. Ayuda a entender el contexto en el que generó la implementación.
      placeholder: "API de Google AI Studio, una sola sesión, le paso los 4 archivos del .ai/"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Voy a copiar `.ai/` a la carpeta sin modificar los archivos canónicos
          required: true
        - label: Voy a respetar los anti-patterns de `.ai/constitution.md`
          required: true
        - label: Voy a verificar que la app levante con `pnpm install && pnpm dev` antes de abrir el PR
          required: true
