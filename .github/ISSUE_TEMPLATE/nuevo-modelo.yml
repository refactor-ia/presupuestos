name: New model
description: Add an LLM to the benchmark
title: "[model] "
labels: ["nuevo-modelo"]
body:
  - type: markdown
    attributes:
      value: |
        Before implementing, open this issue to reserve the model and prevent duplicate work.

  - type: input
    id: modelo
    attributes:
      label: Model
      description: Model name and version (for example, Gemini 2.5 Pro, Qwen 2.5 Coder 32B)
      placeholder: "Gemini 2.5 Pro"
    validations:
      required: true

  - type: input
    id: vendor
    attributes:
      label: Provider
      description: Who provides the model
      placeholder: "Google"
    validations:
      required: true

  - type: input
    id: carpeta
    attributes:
      label: Directory name
      description: The model subdirectory name in the repository (lowercase, no spaces)
      placeholder: "gemini"
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: How you will run the model
      description: Direct API, web UI, IDE, CLI, agent, etc. This helps explain the context in which the implementation was generated.
      placeholder: "Google AI Studio API, one session, providing the four files in .ai/"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I will copy `.ai/` into the directory without modifying the canonical files
          required: true
        - label: I will follow the anti-patterns in `.ai/constitution.md`
          required: true
        - label: I will verify that the app starts with `pnpm install && pnpm dev` before opening the PR
          required: true
