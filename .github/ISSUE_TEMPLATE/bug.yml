name: Bug in an implementation
description: Report a problem in one of the published implementations
title: "[bug][model] "
labels: ["bug"]
body:
  - type: input
    id: modelo
    attributes:
      label: Affected model
      description: Directory containing the bug (claude, codex, deepseek, glm, kimi, mimo, minimax, etc.)
      placeholder: "claude"
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: What happens
      description: A specific description of the problem
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd claude
        2. pnpm dev
        3. ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Expected behavior
      description: 'Cite the spec scenario when applicable (for example, "IVA scenario in .ai/specs/app-presupuestos.yaml")'
    validations:
      required: true

  - type: textarea
    id: entorno
    attributes:
      label: Environment
      placeholder: "macOS 15.4, Node 20.11, pnpm 9, Chrome 130"
    validations:
      required: false
