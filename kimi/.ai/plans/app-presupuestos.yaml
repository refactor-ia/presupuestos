notes: |
  CONTEXTO DE BENCHMARKING
  Este plan es input idéntico para 7 modelos (deepseek, kimi, mimo, minimax, glm, codex, claude).
  Cada modelo implementa en su subcarpeta desde cero. La precisión en strings exactos, formatos
  y comportamientos es deliberada para garantizar comparabilidad.

  ANTI-PATTERNS CRÍTICOS (errores frecuentes):
  - jsPDF en top-level rompe prerender → import dinámico DENTRO del handler.
  - tailwind.config.js no existe en v4 → toda config en app.css con @theme.
  - $mode no existe en mode-watcher v1 → usar mode.current.
  - toFixed(2) y Math.round() no son half-up consistentes → roundHalfUp manual.
  - Intl.NumberFormat con locale es-* genera coma decimal → formatCurrency manual.

  NÚMEROS EXACTOS DEL SCENARIO DE IVA (tests determinísticos):
  3×10.55 + 1×7.77 → subtotal 39.42 → IVA = roundHalfUp(39.42*0.22, 2) = 8.67 → total 48.09.
