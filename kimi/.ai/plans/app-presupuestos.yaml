  - id: T6
    title: Generación de PDF con jsPDF
    description: |
      Implementar src/lib/pdf/exportBudget.ts con import DINÁMICO obligatorio.

      ```ts
      import type { BudgetItem } from '$lib/types/budget';
      import { formatCurrency } from '$lib/utils/currency';

      interface ExportData {
        budgetNumber: string;
        date: string;
        client: { name: string; email: string; address: string; rut: string };
        items: BudgetItem[];
        subtotal: number;
        iva: number;
        total: number;
      }

      export async function exportBudget(data: ExportData): Promise<void> {
        // Import dinámico OBLIGATORIO — top-level rompe prerender
        const { default: jsPDF } = await import('jspdf');

        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 20;
        let y = margin;

        // (1) Header
        doc.setFontSize(18);
        doc.text(data.budgetNumber, margin, y);
        doc.setFontSize(10);
        doc.text(data.date, pageWidth - margin, y, { align: 'right' });
        y += 10;
        doc.line(margin, y, pageWidth - margin, y);
        y += 8;

        // (2) Cliente
        doc.setFontSize(11);
        doc.text('Cliente', margin, y);
        y += 6;
        doc.setFontSize(10);
        doc.text(data.client.name, margin, y); y += 5;
        if (data.client.email) { doc.text(data.client.email, margin, y); y += 5; }
        if (data.client.address) { doc.text(data.client.address, margin, y); y += 5; }
        if (data.client.rut) { doc.text(`RUT: ${data.client.rut}`, margin, y); y += 5; }
        y += 5;

        // (3) Tabla
        const colDesc = margin, colQty = 110, colPrice = 135, colSubtotal = 165;
        doc.setFont('helvetica', 'bold');
        doc.text('Descripción', colDesc, y);
        doc.text('Cant.', colQty, y);
        doc.text('Precio', colPrice, y);
        doc.text('Subtotal', colSubtotal, y);
        y += 4;
        doc.line(margin, y, pageWidth - margin, y);
        y += 5;
        doc.setFont('helvetica', 'normal');

        for (const item of data.items) {
          const itemSubtotal = item.quantity * item.unitPrice;
          doc.text(item.description, colDesc, y);
          doc.text(String(item.quantity), colQty, y);
          doc.text(formatCurrency(item.unitPrice), colPrice, y);
          doc.text(formatCurrency(itemSubtotal), colSubtotal, y);
          y += 6;
        }
        y += 4;
        doc.line(margin, y, pageWidth - margin, y);
        y += 8;

        // (4) Totales
        const labelX = 130, valueX = pageWidth - margin;
        doc.text('Subtotal:', labelX, y);
        doc.text(formatCurrency(data.subtotal), valueX, y, { align: 'right' }); y += 6;
        doc.text('IVA 22%:', labelX, y);
        doc.text(formatCurrency(data.iva), valueX, y, { align: 'right' }); y += 6;
        doc.setFont('helvetica', 'bold');
        doc.text('Total:', labelX, y);
        doc.text(formatCurrency(data.total), valueX, y, { align: 'right' });

        // (5) Footer
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.text('Página 1', pageWidth / 2, doc.internal.pageSize.getHeight() - 10, { align: 'center' });

        doc.save(`${data.budgetNumber}.pdf`);
      }
      ```

      En +page.svelte el handler:
      ```ts
      async function handleExport() {
        const { exportBudget } = await import('$lib/pdf/exportBudget');
        await exportBudget({
          budgetNumber: budgetState.budgetNumber,
          date: budgetState.date,
          client: budgetState.client,
          items: budgetState.items,
          subtotal: budgetState.subtotal,
          iva: budgetState.iva,
          total: budgetState.total
        });
      }
      ```
    satisfies:
      - "Happy path: crear presupuesto completo y exportar PDF"
