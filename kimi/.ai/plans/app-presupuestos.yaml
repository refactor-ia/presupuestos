         export const ssr = false;
         ```

      6. Crear src/routes/+layout.svelte:
         ```svelte
         <script lang="ts">
           import { ModeWatcher } from 'mode-watcher';
           import '../app.css';
           let { children } = $props();
         </script>
         <ModeWatcher defaultMode="dark" />
         {@render children()}
         ```
    satisfies:
      - "Toggle de tema dark/light"
      - "Happy path (prerequisite)"
    entry_file: src/lib/types/budget.ts
    verify: "pnpm build (sin errores TypeScript)"

  - id: T3
    title: Utils puros con tests completos
    description: |
      Implementar los módulos de utilidades con sus tests Vitest.

      === src/lib/utils/rounding.ts ===
      ```ts
      export function roundHalfUp(value: number, decimals: number = 2): number {
        const factor = Math.pow(10, decimals);
        return Math.floor(value * factor + 0.5) / factor;
      }
      ```
      CRÍTICO: NO usar toFixed() ni Math.round() directo — no son half-up consistentes.

      === src/lib/utils/currency.ts ===
      ```ts
      import { roundHalfUp } from './rounding';
      export function formatCurrency(value: number): string {
        const rounded = roundHalfUp(value, 2);
        const [int, dec] = rounded.toFixed(2).split('.');
        return `$ ${int}.${dec}`;
      }
      ```
      CRÍTICO: NO usar Intl.NumberFormat con locale es-* (genera coma decimal).
      Formato EXACTO: prefijo "$ " (signo + espacio) + entero + punto + 2 decimales.

      === src/lib/utils/budgetNumber.ts ===
      ```ts
      export function generateBudgetNumber(): string {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        const digits = String(array[0] % 1_000_000).padStart(6, '0');
        return `PRES-${digits}`;
      }
      ```

      === src/lib/utils/validation.ts ===
      ```ts
      export function isValidQuantity(value: number | string): boolean {
        const n = typeof value === 'string' ? Number(value) : value;
        return Number.isInteger(n) && n >= 1;
      }
      export function isValidPrice(value: unknown): boolean {
        // Rechazar string con coma explícitamente
        if (typeof value === 'string' && value.includes(',')) return false;
        const n = typeof value === 'string' ? Number(value) : (value as number);
        return typeof n === 'number' && !isNaN(n) && n >= 0.01;
      }
      export function isValidEmail(value: string): boolean {
        if (value.trim() === '') return true; // opcional
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value.trim());
      }
      export function isValidName(value: string): boolean {
        return value.trim().length > 0;
      }
      export function isValidDescription(value: string): boolean {
        return value.trim().length > 0;
      }
      ```

      === Tests requeridos ===
      - rounding.test.ts: 8.6724→8.67, 8.675→8.68, 8.674→8.67, 0→0, (39.42*0.22)→8.67
      - currency.test.ts: 0→'$ 0.00', 100→'$ 100.00', 1234.5→'$ 1234.50', 31.65→'$ 31.65', 7.77→'$ 7.77'
      - budgetNumber.test.ts: matchea /^PRES-\d{6}$/, dos llamadas distintas
      - validation tests (en tests/validation.test.ts en T4): cantidades, precios, emails
    satisfies:
      - "Cálculo de totales con IVA 22% y redondeo half-up"
      - "Refresh descarta estado y genera nuevo número PRES"
    entry_file: src/lib/utils/rounding.ts
    verify: "pnpm test (rounding/currency/budgetNumber pasan)"

  - id: T4
    title: State global con runes y lógica de cálculo
    description: |
      Implementar src/lib/state/budget.svelte.ts con el estado completo.

      ```ts
      import { generateBudgetNumber } from '$lib/utils/budgetNumber';
      import { roundHalfUp } from '$lib/utils/rounding';
      import { isValidName, isValidEmail } from '$lib/utils/validation';
      import type { BudgetItem, Client } from '$lib/types/budget';

      function createBudgetState() {
        const budgetNumber = generateBudgetNumber();

        let client = $state<Client>({ name: '', email: '', address: '', rut: '' });
        let items = $state<BudgetItem[]>([]);

        const subtotal = $derived(
          items.reduce((sum, i) => sum + i.quantity * i.unitPrice, 0)
        );
        const iva = $derived(roundHalfUp(subtotal * 0.22, 2));
        const total = $derived(roundHalfUp(subtotal + iva, 2));

        const isClientNameValid = $derived(isValidName(client.name));
        const isClientEmailValid = $derived(isValidEmail(client.email));
        const canExport = $derived(
          isClientNameValid && isClientEmailValid && items.length > 0
        );

        function addItem(item: Omit<BudgetItem, 'id'>): void {
          items.push({ ...item, id: crypto.randomUUID() });
        }
        function removeItem(id: string): void {
          items = items.filter(i => i.id !== id);
        }

        return {
          get budgetNumber() { return budgetNumber; },
          get client() { return client; },
          set client(v: Client) { client = v; },
          get items() { return items; },
          get subtotal() { return subtotal; },
          get iva() { return iva; },
          get total() { return total; },
          get isClientNameValid() { return isClientNameValid; },
          get isClientEmailValid() { return isClientEmailValid; },
          get canExport() { return canExport; },
          addItem,
          removeItem,
          get date() { return new Date().toLocaleDateString('es-UY'); }
        };
      }

      export const budgetState = createBudgetState();
      ```

      Crear tests/totals.test.ts con scenario de IVA:
      - subtotalA = 3 * 10.55 === 31.65
      - subtotalB = 1 * 7.77 === 7.77
      - subtotalTotal = 39.42
      - iva = roundHalfUp(39.42 * 0.22, 2) === 8.67
      - total = 39.42 + 8.67 === 48.09

      Crear tests/validation.test.ts cubriendo todos los casos del spec.
    satisfies:
      - "Cálculo de totales con IVA 22% y redondeo half-up"
      - "Eliminar el último ítem deja totales en cero"
