spec: .ai/specs/app-presupuestos.yaml
created: 2026-05-03
project: presupuestos

current_state:
  description: >
    Proyecto vacío. Cada modelo implementa en su propia subcarpeta (deepseek/, kimi/, mimo/,
    minimax/, glm/, codex/, claude/). El bootstrap parte de cero con pnpm create svelte.
  files:
    - path: package.json
      note: generado por pnpm create svelte; agregar jsPDF, mode-watcher, vitest
    - path: svelte.config.js
      note: debe usar adapter-static con fallback 'index.html'
    - path: src/app.css
      note: '@import "tailwindcss" + @variant dark + @theme con tokens semánticos'
    - path: src/app.html
      note: '<html class="dark"> hardcoded para evitar flash en carga'
    - path: src/routes/+layout.svelte
      note: ModeWatcher con defaultMode="dark"
    - path: src/routes/+layout.ts
      note: 'export const prerender = true; export const ssr = false'
    - path: src/routes/+page.svelte
      note: pantalla única que ensambla todos los componentes
    - path: src/lib/types/budget.ts
      note: interfaces Budget, BudgetItem, Client
    - path: src/lib/utils/currency.ts
      note: 'formatCurrency(value) -> "$ 1234.50"'
    - path: src/lib/utils/rounding.ts
      note: 'roundHalfUp(value, decimals?) -> number'
    - path: src/lib/utils/budgetNumber.ts
      note: 'generateBudgetNumber() con crypto.getRandomValues()'
    - path: src/lib/utils/validation.ts
      note: funciones puras de validación (cantidad, precio, email)
    - path: src/lib/state/budget.svelte.ts
      note: state global con $state, $derived para subtotal/iva/total
    - path: src/lib/components/BudgetForm.svelte
      note: campos cliente con validación reactiva
    - path: src/lib/components/ItemsTable.svelte
      note: lista de ítems con add/remove y validación
    - path: src/lib/components/TotalsPanel.svelte
      note: subtotal/IVA/total en tiempo real
    - path: src/lib/components/ThemeToggle.svelte
      note: toggle dark/light con toggleMode de mode-watcher
    - path: src/lib/pdf/exportBudget.ts
      note: import dinámico de jsPDF dentro del handler; genera PRES-XXXXXX.pdf
    - path: src/lib/utils/currency.test.ts
      note: tests de formatCurrency
    - path: src/lib/utils/rounding.test.ts
      note: tests de roundHalfUp incluyendo casos half-up
    - path: src/lib/utils/budgetNumber.test.ts
      note: tests de generateBudgetNumber
    - path: tests/totals.test.ts
      note: tests de cálculo con los números del scenario de IVA
    - path: tests/validation.test.ts
      note: tests de validación de campos
  patterns:
    - "Svelte 5 runes obligatorios: $state, $derived, $effect, $props, snippets"
    - "Tailwind v4: @import 'tailwindcss' + @variant dark + @theme, sin tailwind.config.js"
    - "mode-watcher v1.x: mode.current (no $mode), toggleMode, defaultMode='dark'"
    - "adapter-static con fallback: 'index.html' obligatorio para SPA routing"
    - "jsPDF: import dinámico dentro del handler, nunca en top-level (rompe SSR/prerender)"
    - "formatCurrency: propio con punto decimal, sin Intl.NumberFormat(locale es-*)"
    - "roundHalfUp: implementado a mano, sin toFixed ni Math.round directo"
    - "crypto.getRandomValues() para PRES-XXXXXX, una vez al iniciar sesión"
    - "Sin localStorage/sessionStorage/IndexedDB — estado efímero por diseño"

architecture:
  pattern: single-page-app
  entry_point: src/routes/+page.svelte
  state_layer:
    file: src/lib/state/budget.svelte.ts
    description: >
      Módulo .svelte.ts que exporta un objeto con $state para el presupuesto completo
      (budgetNumber, client, items) y $derived para subtotal, iva, total, y flags de
      validación (isValid, canExport). budgetNumber se genera con generateBudgetNumber()
      al crear el módulo (una vez por sesión).
  components:
    - name: BudgetForm
      file: src/lib/components/BudgetForm.svelte
      responsibility: >
        Campos de cliente: nombre (obligatorio), email (opcional, validar formato si presente),
        dirección (opcional), RUT (opcional). Muestra errores por campo. Lee y modifica el
        state global.
    - name: ItemsTable
      file: src/lib/components/ItemsTable.svelte
      responsibility: >
        Formulario de ítem inline (descripción, cantidad int ≥ 1, precio ≥ 0.01 con punto).
        Lista de ítems cargados con botón eliminar por fila. Validación por campo con mensajes
        específicos. Rechaza coma en precio.
    - name: TotalsPanel
      file: src/lib/components/TotalsPanel.svelte
      responsibility: >
        Muestra Subtotal, IVA 22% y Total en tiempo real desde $derived del state.
        Formato '$ 1234.50' en todos los valores. Siempre visible, arranca en '$ 0.00'.
    - name: ThemeToggle
      file: src/lib/components/ThemeToggle.svelte
      responsibility: >
        Switch o botón que llama toggleMode(). Refleja mode.current para mostrar estado.
        No guarda preferencia en localStorage.
  utils:
    - file: src/lib/utils/currency.ts
      exports: "formatCurrency(value: number): string — devuelve '$ 1234.50'"
    - file: src/lib/utils/rounding.ts
      exports: "roundHalfUp(value: number, decimals?: number): number — default 2 decimales"
    - file: src/lib/utils/budgetNumber.ts
      exports: "generateBudgetNumber(): string — devuelve 'PRES-XXXXXX' con 6 dígitos random"
    - file: src/lib/utils/validation.ts
      exports: "isValidQuantity, isValidPrice, isValidEmail, isValidName, isValidDescription"
  pdf:
    file: src/lib/pdf/exportBudget.ts
    description: >
      Función exportBudget(budget) async. Dentro hace const { default: jsPDF } = await
      import('jspdf'). Genera el PDF con layout: (1) header PRES-XXXXXX + fecha, (2) datos
      del cliente, (3) tabla con columnas Descripción/Cant./Precio/Subtotal, (4) totales
      Subtotal/IVA 22%/Total, (5) footer con número de página. Llama doc.save('PRES-XXXXXX.pdf').

tech_constraints:
  stack:
    node: "20 LTS"
    package_manager: "pnpm 9"
    framework: "SvelteKit (última estable)"
    language: "TypeScript strict: true"
    svelte: "Svelte 5 con runes obligatorios"
    adapter: "@sveltejs/adapter-static con fallback: 'index.html'"
    styling: "Tailwind CSS v4 con tokens semánticos"
    components: "shadcn-svelte (sobre bits-ui)"
    dark_mode: "mode-watcher v1.x"
    pdf: "jsPDF (importación dinámica en handler)"
    testing: "Vitest"
  forbidden:
    - "writable(), derived(), readable() de svelte/store"
    - "$: (reactividad Svelte 4)"
    - "export let prop (props Svelte 4)"
    - "$mode (mode-watcher v0.x)"
    - "tailwind.config.js / tailwind.config.ts"
    - "@tailwind base/components/utilities"
    - "Colores hardcoded (bg-white, text-gray-500, etc.)"
    - "localStorage / sessionStorage / IndexedDB"
    - "Intl.NumberFormat con locale es-* (genera coma decimal)"
    - "toFixed(2) para redondeo crítico"
    - "import jsPDF en top-level (rompe prerender)"
    - "Omitir fallback: 'index.html' en adapter-static"
  security:
    - "Sin persistencia entre sesiones"
    - "Sin analytics ni requests salientes"
    - "Sin eval ni innerHTML con input del usuario"

testing_strategy:
  framework: vitest
  command: pnpm test
  required_suites:
    - name: currency utils
      file: src/lib/utils/currency.test.ts
      cases:
        - "formatCurrency(0) === '$ 0.00'"
        - "formatCurrency(100) === '$ 100.00'"
        - "formatCurrency(1234.5) === '$ 1234.50'"
        - "formatCurrency(31.65) === '$ 31.65'"
        - "formatCurrency(7.77) === '$ 7.77'"
    - name: rounding utils
      file: src/lib/utils/rounding.test.ts
      cases:
        - "roundHalfUp(8.6724, 2) === 8.67"
        - "roundHalfUp(8.675, 2) === 8.68 (half-up, no banker's rounding)"
        - "roundHalfUp(8.674, 2) === 8.67"
        - "roundHalfUp(0, 2) === 0"
        - "roundHalfUp(39.42 * 0.22, 2) === 8.67 (caso del scenario de IVA)"
    - name: budgetNumber utils
      file: src/lib/utils/budgetNumber.test.ts
      cases:
        - "generateBudgetNumber() devuelve string que matchea /^PRES-\\d{6}$/"
        - "dos llamadas consecutivas retornan valores distintos con alta probabilidad"
    - name: totals calculation
      file: tests/totals.test.ts
      cases:
        - "items: [{qty:3, price:10.55}, {qty:1, price:7.77}]"
        - "subtotal A === 31.65"
        - "subtotal B === 7.77"
        - "subtotal total === 39.42"
        - "IVA 22% === 8.67 (39.42 * 0.22 = 8.6724 -> roundHalfUp -> 8.67)"
        - "total === 48.09"
    - name: validation
      file: tests/validation.test.ts
      cases:
        - "cantidad 0 es inválida"
        - "cantidad 1.5 es inválida (no entero)"
        - "cantidad -3 es inválida"
        - "cantidad 1 es válida"
        - "precio -10 es inválido"
        - "precio 0 es inválido"
        - "precio '12,50' (string con coma) es inválido"
        - "precio 0.01 es válido"
        - "email '' es válido (opcional)"
        - "email 'no-es-email' es inválido"
        - "email 'info@acme.com' es válido"

tasks:
  - id: T1
    title: Bootstrap del proyecto
    description: |
      Crear el proyecto SvelteKit desde cero en la subcarpeta del modelo.
      Pasos exactos en orden:
      1. `pnpm create svelte@latest . -- --template skeleton --types typescript --no-prettier --no-eslint`
         (dentro de la subcarpeta vacía del modelo)
      2. `pnpm install`
      3. Instalar dependencias de producción:
         `pnpm add mode-watcher jspdf`
      4. Instalar shadcn-svelte y Tailwind v4:
         `pnpm dlx shadcn-svelte@latest init`
         (seleccionar: TypeScript=yes, Tailwind=yes, App css path=src/app.css)
      5. Instalar Vitest:
         `pnpm add -D vitest @vitest/ui jsdom`
      6. Configurar adapter-static en svelte.config.js:
         ```js
         import adapter from '@sveltejs/adapter-static';
         export default { kit: { adapter: adapter({ fallback: 'index.html' }) } };
         ```
      7. En vite.config.ts agregar bloque de Vitest:
         ```ts
         test: { environment: 'jsdom', globals: true }
         ```
      8. En package.json agregar: `"test": "vitest run"`
      9. Verificar que `pnpm dev` levanta sin errores y que `pnpm build` completa.

      CRÍTICO:
      - NO generar tailwind.config.js — Tailwind v4 no lo usa.
      - NO usar @tailwind base/components/utilities en CSS.
      - adapter-static DEBE tener fallback: 'index.html'.
    satisfies:
      - "Happy path (prerequisite)"
    entry_file: svelte.config.js
    verify: "pnpm dev (sin errores en consola) && pnpm build (termina sin errores)"

  - id: T2
    title: Estructura de archivos, tipos de dominio y CSS base
    description: |
      Crear toda la estructura de carpetas y archivos con su contenido inicial.

      1. Crear `src/lib/types/budget.ts` con:
         ```ts
         export interface Client {
           name: string;
           email: string;
           address: string;
           rut: string;
         }
         export interface BudgetItem {
           id: string;
           description: string;
           quantity: number;
           unitPrice: number;
         }
         export interface Budget {
           number: string;
           date: string;
           client: Client;
           items: BudgetItem[];
         }
         ```

      2. Crear carpetas: src/lib/utils/, src/lib/state/, src/lib/pdf/, src/lib/components/

      3. Reemplazar contenido de src/app.css con:
         ```css
         @import "tailwindcss";
         @variant dark (&:where(.dark, .dark *));
         @theme {
           --color-background: oklch(1 0 0);
           --color-foreground: oklch(0.145 0 0);
           --color-card: oklch(1 0 0);
           --color-card-foreground: oklch(0.145 0 0);
           --color-muted: oklch(0.961 0 0);
           --color-muted-foreground: oklch(0.556 0 0);
           --color-border: oklch(0.922 0 0);
           --color-primary: oklch(0.205 0 0);
           --color-primary-foreground: oklch(0.985 0 0);
           --color-destructive: oklch(0.577 0.245 27.325);
         }
         .dark {
           --color-background: oklch(0.145 0 0);
           --color-foreground: oklch(0.985 0 0);
           --color-card: oklch(0.205 0 0);
           --color-card-foreground: oklch(0.985 0 0);
           --color-muted: oklch(0.269 0 0);
           --color-muted-foreground: oklch(0.708 0 0);
           --color-border: oklch(0.269 0 0);
           --color-primary: oklch(0.922 0 0);
           --color-primary-foreground: oklch(0.205 0 0);
